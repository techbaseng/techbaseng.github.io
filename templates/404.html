{% extends "base.html" %}
{% from "_macros.html" import icon %}
{% block body %}
<main id="main" class="notfound">
  <div class="wrap">
    <h1 aria-label="Error 404">404</h1>
    <p>That page does not exist, or it moved. Try the search, or head back to the home page.</p>
    <div class="hero-actions" style="justify-content:center">
      <a class="btn btn--lg" href="{{ ''|u }}">Go home {{ icon('arrow','icon-arrow') }}</a>
      <a class="btn btn--lg btn--ghost" href="{{ 'learn/'|u }}">Browse courses</a>
      <button class="btn btn--lg btn--ghost" type="button" data-open-search>{{ icon('search') }} Search the site</button>
    </div>
  </div>
</main>
{% endblock %}
