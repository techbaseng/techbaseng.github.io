name: Problem in a lesson
description: A typo, wrong code, broken button or unclear explanation
labels: [lesson]
body:
  - type: input
    id: page
    attributes:
      label: Page address
      description: Copy the address from your browser.
      placeholder: https://techbaseng.github.io/techbase-css/lessons/lesson_01.html
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong?
      description: Tell us what you saw and what you expected.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: Android phone, Chrome
